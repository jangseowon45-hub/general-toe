<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#131722">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>general-toe</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header id="topbar">
    <div class="row">
      <select id="symbol" aria-label="심볼"></select>
      <div id="intervals" class="seg" role="group" aria-label="봉 주기"></div>
    </div>
    <div class="row">
      <div id="indicators" class="seg" role="group" aria-label="지표"></div>
      <label class="chip toggle"><input type="checkbox" id="showTrades"> 봇 체결</label>
      <label class="chip toggle bot"><input type="checkbox" id="botView"> 🤖 봇 뷰</label>
      <label class="chip file" title="봇 체결 CSV 불러오기">CSV<input type="file" id="csvFile" accept=".csv,text/csv"></label>
    </div>
    <div class="row tools">
      <div id="tools" class="seg scroll" role="group" aria-label="그리기 도구">
        <button data-tool="cursor" class="on" title="커서: 그림 탭=선택, 핸들 드래그=편집">✥</button>
        <button data-tool="trend" title="추세선 (두 점)">╱</button>
        <button data-tool="ray" title="레이 (두 점, 오른쪽 무한)">⟋</button>
        <button data-tool="extended" title="연장선 (두 점, 양쪽 무한)">⟷</button>
        <button data-tool="hline" title="수평선">―</button>
        <button data-tool="hray" title="수평 레이 (오른쪽만)">⊢</button>
        <button data-tool="vline" title="수직선">|</button>
        <button data-tool="rect" title="사각형 (두 점)">▭</button>
        <button data-tool="channel" title="평행 채널 (세 점)">⫽</button>
        <button data-tool="fib" title="피보나치 되돌림 (두 점)">Fib</button>
        <button data-tool="text" title="텍스트">T</button>
        <button data-tool="arrow" title="화살표 (두 점)">➚</button>
        <button data-tool="measure" title="측정 (두 점)">📏</button>
        <button data-tool="alert" title="가격 알림: 가격 탭">🔔</button>
      </div>
      <div class="seg">
        <button id="undoBtn" title="실행취소 (Ctrl+Z)">↶</button>
        <button id="redoBtn" title="다시실행 (Ctrl+Y)">↷</button>
        <button id="magnetBtn" title="자석: 시·고·저·종가에 붙기">🧲</button>
      </div>
      <button id="clearDrawings" class="chip" title="이 심볼의 그림 모두 삭제">모두 삭제</button>
      <button id="toggleAlerts" class="chip">알림 목록</button>
      <button id="settingsBtn" class="chip" title="알림 중계 설정">⚙</button>
    </div>
  </header>
  <main id="chart">
    <div id="shapeBar" hidden></div>
    <aside id="botPanel" hidden></aside>
    <aside id="alertPanel" hidden>
      <div id="alertList"></div>
      <div class="actions"><button id="testPush" class="chip">테스트 알림 보내기</button></div>
    </aside>
  </main>
  <footer id="status">
    <span id="price">–</span>
    <span id="tradeinfo"></span>
    <span id="alertStatus"></span>
    <span id="conn" class="conn">연결 중…</span>
  </footer>
  <dialog id="settings">
    <form method="dialog">
      <h3>알림 중계 설정</h3>
      <label>중계 주소<input id="relayUrl" type="url" placeholder="https://.../relay" autocomplete="off"></label>
      <label>중계 키<input id="relayKey" type="password" placeholder="서버의 RELAY_KEY" autocomplete="off"></label>
      <p class="hint">키는 이 기기에만 저장돼요. 서버: /etc/general-toe-relay.env</p>
      <menu><button value="cancel">취소</button><button value="ok" class="primary">저장</button></menu>
    </form>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
